name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın çalışsın; yeni push gelirse bekleyen yayın iptal edilmesin
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Site dosyalarını hazırla
        run: |
          mkdir _site
          cp index.html style.css app.js _site/

      - name: Pages'i yapılandır
        uses: actions/configure-pages@v5

      - name: Siteyi artifact olarak yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
